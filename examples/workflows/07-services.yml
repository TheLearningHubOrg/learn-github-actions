# Stage 3: a service container the job's steps reach on localhost.
name: Service containers

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        # The job waits for the health check to pass before the first step.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/app_test
    steps:
      - name: Query the service
        run: psql "$DATABASE_URL" -c 'select version();'
