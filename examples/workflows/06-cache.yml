# Stage 3: two ways to cache, and how to read cache-hit.
name: Cache

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-node-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Caches the npm download cache keyed on the lockfile hash.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

  explicit-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restore or create the npm download cache
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-
      - name: Explain the result
        env:
          HIT: ${{ steps.npm-cache.outputs.cache-hit }}
        run: |
          # cache-hit is "true" only for an exact key match. A restore-keys
          # match restores an older entry and leaves cache-hit "false".
          echo "exact hit: ${HIT:-false}"
      - run: npm ci --prefer-offline --no-audit
