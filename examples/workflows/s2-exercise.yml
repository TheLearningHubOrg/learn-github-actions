# Solution to the Stage 2 exercise: a dispatch input flows through a step
# output, a job output and the job summary, and untrusted text never touches
# the shell through ${{ }}.
name: Stage 2 exercise

on:
  workflow_dispatch:
    inputs:
      release-name:
        description: Free text, treated as untrusted
        type: string
        required: true
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Compute the next version from package.json
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current="$(node -p "require('./package.json').version")"
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            *)     next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$next" >> "$GITHUB_OUTPUT"

  announce:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise without expression injection
        env:
          NAME: ${{ inputs.release-name }}
          NEXT: ${{ needs.plan.outputs.next }}
        run: |
          printf '### Release %s\n\nName: %s\n' "$NEXT" "$NAME" >> "$GITHUB_STEP_SUMMARY"
